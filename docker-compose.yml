version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: nexus_postgres
    restart: unless-stopped
    environment:
      # Важно: POSTGRES_DB должен совпадать с именем в DATABASE_URL
      POSTGRES_USER: ${DB_POSTGRES_USER:-nexus}
      POSTGRES_PASSWORD: ${DB_POSTGRES_PASSWORD:-secure_password}
      POSTGRES_DB: ${DB_POSTGRES_DB:-nexus} 
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      # Добавлена проверка конкретной базы данных (-d)
      test: ["CMD-SHELL", "pg_isready -U ${DB_POSTGRES_USER:-nexus} -d ${DB_POSTGRES_DB:-nexus}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nexus_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus_bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_POSTGRES_USER:-nexus}:${DB_POSTGRES_PASSWORD:-secure_password}@postgres:5432/${DB_POSTGRES_DB:-nexus}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/project/logs
      - ./:/project
    command: python app/bot.py

volumes:
  postgres_data:
  redis_data: